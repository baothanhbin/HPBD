<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chiếc Hộp Điều Ước của Huyền 🎁</title>
    <style>
        body {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Comic Sans MS', cursive, sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            overflow-x: hidden;
            height: 500vh;
        }

        .section {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* Particles Background */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #ffd700;
            border-radius: 50%;
            animation: float 6s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); opacity: 0.7; }
            50% { transform: translateY(-20px) rotate(180deg); opacity: 1; }
        }

        /* Gift Box Section */
        .gift-section {
            position: relative;
            z-index: 10;
        }

        .gift-box {
            width: 350px;
            height: 350px;
            position: relative;
            transform-style: preserve-3d;
            transition: all 1s ease-in-out;
            cursor: pointer;
            animation: giftFloat 4s ease-in-out infinite;
        }

        @keyframes giftFloat {
            0%, 100% { transform: translateY(0px) rotateY(0deg); }
            50% { transform: translateY(-10px) rotateY(5deg); }
        }

        .box-face {
            position: absolute;
            width: 350px;
            height: 350px;
            background: linear-gradient(135deg, #e74c3c, #c0392b, #8e44ad, #9b59b6);
            background-size: 400% 400%;
            animation: gradientShift 3s ease infinite;
            border: 4px solid #fff;
            box-shadow: 
                0 0 40px rgba(231, 76, 60, 0.6),
                inset 0 0 20px rgba(255, 255, 255, 0.1);
            border-radius: 8px;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .box-top { transform: rotateX(90deg) translateZ(175px); }
        .box-bottom { transform: rotateX(-90deg) translateZ(175px); }
        .box-front { transform: translateZ(175px); }
        .box-back { transform: translateZ(-175px) rotateY(180deg); }
        .box-left { transform: rotateY(-90deg) translateZ(175px); }
        .box-right { transform: rotateY(90deg) translateZ(175px); }

        .ribbon {
            position: absolute;
            background: linear-gradient(45deg, #f1c40f, #f39c12, #e67e22);
            box-shadow: 
                0 0 30px rgba(241, 196, 15, 0.8),
                inset 0 2px 10px rgba(255, 255, 255, 0.3);
            border-radius: 4px;
        }

        .ribbon-v {
            width: 50px;
            height: 100%;
            left: 50%;
            transform: translateX(-50%);
        }

        .ribbon-h {
            height: 50px;
            width: 100%;
            top: 50%;
            transform: translateY(-50%);
        }

        .bow {
            position: absolute;
            top: -40px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 80px;
            background: linear-gradient(45deg, #f1c40f, #f39c12);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            box-shadow: 
                0 0 35px rgba(241, 196, 15, 1),
                inset 0 4px 15px rgba(255, 255, 255, 0.4);
            animation: bowGlow 2s infinite alternate;
            position: relative;
        }

        .bow::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 60px;
            background: linear-gradient(45deg, #e67e22, #d35400);
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(230, 126, 34, 0.6);
        }

        @keyframes bowGlow {
            0% { box-shadow: 0 0 25px rgba(255, 215, 0, 0.8); }
            100% { box-shadow: 0 0 40px rgba(255, 215, 0, 1); }
        }

        .instruction {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 18px;
            text-align: center;
            animation: pulse 2s infinite;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.7; transform: translateX(-50%) scale(1); }
            50% { opacity: 1; transform: translateX(-50%) scale(1.05); }
        }

        /* Confetti */
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background: #ff6b6b;
            animation: confetti-fall 3s linear infinite;
            z-index: 100;
        }

        @keyframes confetti-fall {
            0% { transform: translateY(-100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }

        /* Photo Section */
        .photo-section {
            flex-direction: column;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .photo-frame {
            width: 400px;
            height: 300px;
            background: #fff;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            position: relative;
            overflow: hidden;
            margin-bottom: 30px;
        }

        .photo-placeholder {
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, #ff9a9e, #fecfef);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .photo-placeholder img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .message {
            max-width: 600px;
            text-align: center;
            color: #fff;
            font-size: 24px;
            line-height: 1.6;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
            animation: typewriter 4s steps(100) 1s both;
        }

        @keyframes typewriter {
            0% { width: 0; opacity: 0; }
            1% { opacity: 1; }
            100% { width: 100%; opacity: 1; }
        }

        /* Cake Section */
        .cake-section {
            background: linear-gradient(135deg, #ff9a9e, #fecfef, #ffecd2);
            flex-direction: column;
        }

        .cake {
            position: relative;
            width: 420px;
            height: 360px;
            margin-bottom: 30px;
            animation: cakeFloat 3s ease-in-out infinite;
            transform-style: preserve-3d;
        }

        @keyframes cakeFloat {
            0%, 100% { transform: translateY(0px) rotateY(0deg); }
            50% { transform: translateY(-8px) rotateY(2deg); }
        }

        /* Two-tier cake matching reference */
        .tier {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            background: #e0574f;
            border: 4px solid #ffffff;
            border-radius: 28px;
            box-shadow:
                0 12px 30px rgba(0,0,0,0.25),
                inset 0 0 18px rgba(255,255,255,0.12);
        }

        .tier.bottom {
            width: 420px;
            height: 170px;
            bottom: 0;
        }

        .tier.top {
            width: 320px;
            height: 140px;
            bottom: 150px;
        }

        .icing {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% + 16px);
            height: 70px;
            top: -16px;
            background: #ffffff;
            border-radius: 24px;
            border: 4px solid #ffffff;
            box-shadow: 0 8px 14px rgba(0,0,0,0.12);
            /* create drips using mask of circles */
            -webkit-mask:
                radial-gradient(32px 28px at 10% 90%, transparent 28px, #000 29px) bottom left / 22% 60% repeat-x,
                radial-gradient(28px 24px at 35% 95%, transparent 24px, #000 25px) bottom left / 22% 60% repeat-x,
                radial-gradient(26px 22px at 65% 95%, transparent 22px, #000 23px) bottom left / 22% 60% repeat-x,
                radial-gradient(30px 26px at 90% 90%, transparent 26px, #000 27px) bottom left / 22% 60% repeat-x,
                linear-gradient(#000,#000);
                    mask:
                radial-gradient(32px 28px at 10% 90%, transparent 28px, #000 29px) bottom left / 22% 60% repeat-x,
                radial-gradient(28px 24px at 35% 95%, transparent 24px, #000 25px) bottom left / 22% 60% repeat-x,
                radial-gradient(26px 22px at 65% 95%, transparent 22px, #000 23px) bottom left / 22% 60% repeat-x,
                radial-gradient(30px 26px at 90% 90%, transparent 26px, #000 27px) bottom left / 22% 60% repeat-x,
                linear-gradient(#000,#000);
        }

        /* small cone-like drops */
        .drop {
            position: absolute;
            width: 26px;
            height: 26px;
            border-radius: 50% 50% 40% 40% / 55% 55% 45% 45%;
            bottom: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
        }

        .drop.red { background: #e0574f; border: 3px solid #ffffff; }
        .drop.yellow { background: #e0b629; border: 3px solid #ffffff; }

        /* Decorative glow */
        .cake::after {
            content: '';
            position: absolute;
            top: 36px;
            left: 50%;
            transform: translateX(-50%);
            width: 110px;
            height: 110px;
            background: radial-gradient(circle, rgba(255,215,0,0.28) 0%, transparent 70%);
            border-radius: 50%;
            animation: decorationGlow 3s ease-in-out infinite;
        }

        @keyframes decorationGlow {
            0%, 100% {
                transform: translateX(-50%) scale(1);
                box-shadow: 0 0 20px rgba(255,215,0,0.4);
            }
            50% {
                transform: translateX(-50%) scale(1.2);
                box-shadow: 0 0 40px rgba(255,215,0,0.6);
            }
        }

        .cake-decoration {
            position: absolute;
            top: 18px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 26px;
            animation: decorationFloat 4s ease-in-out infinite;
            text-shadow: 0 0 10px rgba(255,255,255,0.8);
        }



        @keyframes decorationFloat {
            0%, 100% { transform: translateX(-50%) translateY(0px); }
            50% { transform: translateX(-50%) translateY(-5px); }
        }

        /* Three striped candles */
        .candles-3 {
            position: absolute;
            top: -74px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 28px;
            align-items: flex-end;
        }

        .candle {
            width: 24px;
            height: 70px;
            background: repeating-linear-gradient(
                to bottom,
                #f4f4f4 0 12px,
                #ff7070 12px 24px
            );
            border-radius: 10px;
            border: 3px solid #ffffff;
            position: relative;
            box-shadow: 0 6px 12px rgba(0,0,0,0.18);
        }

        .flame {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 16px;
            height: 20px;
            background: radial-gradient(ellipse at center bottom, #ffd700 0%, #ff6b6b 50%, #ff4757 100%);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            animation: flicker 1.5s infinite alternate;
            box-shadow: 
                0 0 15px rgba(255, 215, 0, 0.8),
                0 0 25px rgba(255, 107, 107, 0.4);
        }

        .flame::before {
            content: '';
            position: absolute;
            top: 30%;
            left: 50%;
            transform: translateX(-50%);
            width: 8px;
            height: 12px;
            background: radial-gradient(ellipse, #fff 0%, #ffd700 70%);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
        }

        @keyframes flicker {
            0% { 
                transform: translateX(-50%) scale(1) rotate(-2deg); 
                box-shadow: 0 0 15px rgba(255, 215, 0, 0.8), 0 0 25px rgba(255, 107, 107, 0.4);
            }
            100% { 
                transform: translateX(-50%) scale(1.1) rotate(2deg); 
                box-shadow: 0 0 20px rgba(255, 215, 0, 1), 0 0 35px rgba(255, 107, 107, 0.6);
            }
        }

        .blow-button {
            background: linear-gradient(45deg, #ff6b6b, #ff8e8e);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 20px;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(255, 107, 107, 0.3);
            transition: all 0.3s ease;
            font-family: inherit;
            font-weight: bold;
        }

        .blow-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(255, 107, 107, 0.4);
        }

        /* Fireworks */
        .firework {
            position: fixed;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            animation: firework 1s ease-out forwards;
            z-index: 1000;
        }

        @keyframes firework {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(20); opacity: 0; }
        }

        /* Final Message */
        .final-section {
            background: linear-gradient(135deg, #667eea, #764ba2, #f093fb, #f5576c);
            flex-direction: column;
        }

        .birthday-title {
            font-size: 60px;
            color: #fff;
            text-align: center;
            margin-bottom: 30px;
            text-shadow: 0 5px 10px rgba(0,0,0,0.3);
            animation: rainbow 3s infinite;
        }

        @keyframes rainbow {
            0% { color: #ff6b6b; }
            16% { color: #ffa500; }
            33% { color: #ffd700; }
            50% { color: #32cd32; }
            66% { color: #1e90ff; }
            83% { color: #9370db; }
            100% { color: #ff6b6b; }
        }

        .final-message {
            max-width: 800px;
            text-align: center;
            color: #fff;
            font-size: 22px;
            line-height: 1.8;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        /* Wish Box Section */
        .wish-section {
            background: linear-gradient(135deg, #f6d365, #fda085);
            flex-direction: column;
            gap: 24px;
        }

        .wish-title {
            color: #ffffff;
            font-size: 28px;
            text-shadow: 0 3px 8px rgba(0,0,0,0.25);
            margin-bottom: 6px;
        }

        .wish-box {
            width: 260px;
            height: 220px;
            position: relative;
            cursor: pointer;
            perspective: 800px;
        }

        .wish-body {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 240px;
            height: 150px;
            background: linear-gradient(135deg, #ff6b6b, #c0392b);
            border-radius: 12px;
            border: 4px solid #ffffff;
            box-shadow: 0 12px 30px rgba(0,0,0,0.25), inset 0 0 18px rgba(255,255,255,0.12);
        }

        .wish-lid {
            position: absolute;
            bottom: 150px;
            left: 50%;
            transform: translateX(-50%);
            width: 260px;
            height: 60px;
            background: linear-gradient(135deg, #f1c40f, #e67e22);
            border-radius: 12px;
            border: 4px solid #ffffff;
            transform-origin: center bottom;
            transition: transform 0.8s ease, box-shadow 0.8s ease;
            box-shadow: 0 12px 24px rgba(0,0,0,0.2);
        }

        .wish-box.opened .wish-lid {
            transform: translateX(-50%) translateY(-80px) rotateX(65deg);
            box-shadow: 0 26px 60px rgba(0,0,0,0.35);
        }

        .wish-message {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 220px;
            text-align: center;
            color: #ffffff;
            font-size: 20px;
            line-height: 1.5;
            text-shadow: 0 2px 6px rgba(0,0,0,0.35);
            opacity: 0;
            transition: opacity 0.6s ease 0.2s, transform 0.6s ease 0.2s;
        }

        .wish-box.opened .wish-message {
            opacity: 1;
            transform: translateX(-50%) translateY(-10px);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .gift-box { width: 250px; height: 250px; }
            .box-face { width: 250px; height: 250px; }
            .photo-frame { width: 320px; height: 240px; }
            .message { font-size: 18px; }
            .birthday-title { font-size: 40px; }
            .final-message { font-size: 18px; }
        }
    </style>
</head>
<body>
    <!-- Floating Particles -->
    <div class="particles" id="particles"></div>

    <!-- Section 1: Gift Box -->
    <div class="section gift-section" id="section1">
        <div class="gift-box" id="giftBox">
            <div class="box-face box-front">
                <div class="ribbon ribbon-v"></div>
                <div class="ribbon ribbon-h"></div>
            </div>
            <div class="box-face box-back">
                <div class="ribbon ribbon-v"></div>
                <div class="ribbon ribbon-h"></div>
            </div>
            <div class="box-face box-left">
                <div class="ribbon ribbon-v"></div>
            </div>
            <div class="box-face box-right">
                <div class="ribbon ribbon-v"></div>
            </div>
            <div class="box-face box-top">
                <div class="ribbon ribbon-h"></div>
                <div class="bow"></div>
            </div>
            <div class="box-face box-bottom"></div>
        </div>
        <div class="instruction">
            ✨ Kéo chuột xuống để mở món quà dành cho Huyền... ✨
        </div>
    </div>

    <!-- Section 2: Photo & Message -->
    <div class="section photo-section" id="section2">
        <div class="photo-frame">
            <div class="photo-placeholder">
                    <img src="avt.jpg" alt="Ảnh Huyền">
            </div>
        </div>
        <div class="message">
            🎉 Chúc mừng sinh nhật Huyền Thảo Mai! 🎂<br>
            Chúc cậu luôn vật vã(theo nghĩa bóng nhé :P), kiếm nhiều $ và khum app lực trong mọi thứ
            Lướt dần nhé điều bất ngờ ở cuối! 
            생일 축하해요! 💕✨
        </div>
    </div>

    <!-- Section 3: Birthday Cake -->
    <div class="section cake-section" id="section3">
        <div class="cake">
            <div class="tier bottom">
                <div class="icing"></div>
                <div class="drop yellow" style="left: 24px;"></div>
                <div class="drop yellow" style="left: 110px;"></div>
                <div class="drop yellow" style="left: 200px;"></div>
                <div class="drop yellow" style="left: 290px;"></div>
                <div class="drop yellow" style="left: 370px;"></div>
            </div>

            <div class="tier top">
                <div class="icing"></div>
                <div class="drop red" style="left: 40px; bottom: 6px;"></div>
                <div class="drop red" style="left: 120px; bottom: 10px;"></div>
                <div class="drop red" style="left: 200px; bottom: 8px;"></div>
                <div class="drop red" style="left: 270px; bottom: 12px;"></div>
                <div class="candles-3" id="candles3">
                    <div class="candle"><div class="flame"></div></div>
                    <div class="candle"><div class="flame"></div></div>
                    <div class="candle"><div class="flame"></div></div>
                </div>
            </div>

            <div class="cake-decoration">🎂 HUYỀN 🎂</div>
        </div>
        <button class="blow-button" id="blowButton">🌬️ THỔI NẾN ONLINE! Bấm Zô Đây 🌬️</button>
    </div>


    <!-- Section 5: Wish Box -->
    <div class="section wish-section" id="section5">
        <div class="wish-title">✨ Hộp điều ước ✨</div>
        <div class="wish-box" id="wishBox">
            <div class="wish-lid"></div>
            <div class="wish-body"></div>
            <div class="wish-message" id="wishMsg">Nhấn để mở hộp quà...</div>
        </div>
    </div>

    <script>
        // Create floating particles
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            for (let i = 0; i < 50; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 6 + 's';
                particle.style.animationDuration = (Math.random() * 3 + 3) + 's';
                particlesContainer.appendChild(particle);
            }
        }

        // No multi-candle generation needed anymore (single candle in markup)

        // Create confetti
        function createConfetti() {
            const colors = ['#ff6b6b', '#ffd700', '#32cd32', '#1e90ff', '#ff69b4', '#ffa500'];
            for (let i = 0; i < 100; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDelay = Math.random() * 3 + 's';
                confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
                document.body.appendChild(confetti);
                
                setTimeout(() => {
                    confetti.remove();
                }, 5000);
            }
        }

        // Create fireworks
        function createFireworks() {
            const colors = ['#ff6b6b', '#ffd700', '#32cd32', '#1e90ff', '#ff69b4', '#ffa500'];
            for (let i = 0; i < 20; i++) {
                setTimeout(() => {
                    const firework = document.createElement('div');
                    firework.className = 'firework';
                    firework.style.left = Math.random() * 100 + '%';
                    firework.style.top = Math.random() * 100 + '%';
                    firework.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    document.body.appendChild(firework);
                    
                    setTimeout(() => {
                        firework.remove();
                    }, 1000);
                }, i * 200);
            }
        }

        // Scroll handling
        let currentSection = 0;
        const sections = document.querySelectorAll('.section');

        function handleScroll() {
            const scrollY = window.scrollY;
            const windowHeight = window.innerHeight;
            const newSection = Math.floor(scrollY / windowHeight);

            if (newSection !== currentSection && newSection < sections.length) {
                currentSection = newSection;
                
                switch(currentSection) {
                    case 1:
                        // Open gift box
                        const giftBox = document.getElementById('giftBox');
                        giftBox.style.transform = 'rotateX(-90deg) scale(0.5)';
                        giftBox.style.opacity = '0.3';
                        createConfetti();
                        break;
                    case 2:
                        // Show photo and message
                        break;
                    case 3:
                        // Show cake
                        break;
                }
            }
        }

        // Create audio element for birthday music
        const birthdayMusic = new Audio();
        birthdayMusic.src = 'happy-birthday.mp3'; // Đặt file MP3 cùng thư mục với file HTML
        birthdayMusic.volume = 0.7;
        birthdayMusic.loop = false;

        // Blow candles functionality (3 flames)
        document.getElementById('blowButton').addEventListener('click', function() {
            const flames = document.querySelectorAll('#candles3 .flame');
            
            // Play birthday music
            birthdayMusic.play().catch(error => {
                console.log('Không thể phát nhạc tự động. Người dùng cần tương tác trước.');
            });
            
            // Blow out all flames with a small stagger
            flames.forEach((f, i) => {
                setTimeout(() => {
                    f.style.opacity = '0';
                    f.style.transform = 'translateX(-50%) scale(0)';
                }, i * 120);
            });

            // After all candles are blown out
            setTimeout(() => {
                createFireworks();
                document.getElementById('finalTitle').style.opacity = '1';
                document.getElementById('finalTitle').style.animation = 'rainbow 3s infinite';
                
                setTimeout(() => {
                    document.getElementById('finalMsg').style.opacity = '1';
                }, 1000);
            }, 600);
        });

        // Initialize
        window.addEventListener('scroll', handleScroll);
        createParticles();
        // three candles already in DOM

        // Smooth scrolling
        document.addEventListener('wheel', function(e) {
            e.preventDefault();
            const delta = e.deltaY;
            const scrollSpeed = 2;
            window.scrollBy(0, delta * scrollSpeed);
        }, { passive: false });

        // Wish box logic
        const wishBox = document.getElementById('wishBox');
        const wishMsg = document.getElementById('wishMsg');
        if (wishBox) {
            wishBox.addEventListener('click', () => {
                if (!wishBox.classList.contains('opened')) {
                    wishBox.classList.add('opened');
                    const min = 50_000;
                    const max = 100_000;
                    const amount = Math.floor(Math.random() * (max - min + 1)) + min;
                    const formatted = amount.toLocaleString('vi-VN');
                    wishMsg.innerHTML = `Cậu sẽ nhận được <b>${formatted}đ</b> trong vài phút, screenshot gửi tớ nhé :))`;
                    createConfetti();
                }
            });
        }
    </script>
